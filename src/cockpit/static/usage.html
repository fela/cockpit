<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f7f4">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141210">
  <title>Cockpit usage</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cockpit">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/motion.css">
  <link rel="stylesheet" href="/static/marks.css">
  <link rel="stylesheet" href="/static/usage.css">
  <link rel="stylesheet" href="/static/look.css">
  <link rel="stylesheet" href="/static/page-rail.css">
  <link rel="stylesheet" href="/static/keyboard.css">
  <link rel="stylesheet" href="/static/loading.css">
  <script src="/static/local-auth.js"></script>
  <script src="/static/errors.js"></script>
  <script src="/static/center-frame.js"></script>
  <script src="/static/uses.js" defer></script>
  <script src="/static/page-update.js" defer></script>
  <script src="/static/icons.js"></script>
  <script src="/static/motion.js" defer></script>
  <script src="/static/presence.js" defer></script>
  <script src="/static/prefs.js" defer></script>
  <script src="/static/keyboard.js" defer></script>
  <script src="/static/pick.js" defer></script>
  <script src="/static/loading.js" defer></script>
  <script src="/static/feedback.js" defer></script>
  <script src="/static/usage-common.js" defer></script>
  <!-- part scripts -->
  <script src="/static/usage.js" defer></script>
  <!-- part styles -->
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <details class="menu brand-menu">
        <summary class="brand" title="Cockpit" aria-label="Cockpit"><span class="brand-mark"></span></summary>
        <div class="menu-list">
          <a href="/"><span class="menu-label"><svg class="icon icon-step" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 13.5H6V10h3.5V6.5H13V3"/></svg>Cockpit</span></a>
          <a href="/classic#sessions"><span class="menu-label"><svg class="icon icon-layers" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5l6 3.25-6 3.25-6-3.25z"/><path d="M2 9.25l6 3.25 6-3.25"/></svg>Sessions</span></a>
          <a href="/briefing"><span class="menu-label"><svg class="icon icon-log" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h7.5M6 8h7.5M6 12h7.5"/><circle cx="3" cy="4" r="1" fill="currentColor" stroke="none"/><circle cx="3" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="3" cy="12" r="1" fill="currentColor" stroke="none"/></svg>Briefing</span></a>
          <a href="/pages"><span class="menu-label"><svg class="icon icon-chart" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 13.5h12M4.5 11V8M8 11V3.5M11.5 11V6"/></svg>Pages</span></a>
          <a href="/usage" aria-current="page"><span class="menu-label"><svg class="icon icon-meter" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 11.5a5.5 5.5 0 1 1 11 0"/><path d="M8 11.5l2.8-3.4"/><circle cx="8" cy="11.5" r="1.1" fill="currentColor" stroke="none"/><path d="M2 14h12"/></svg>Usage</span></a>
          <a href="/spec"><span class="menu-label"><svg class="icon icon-doc" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 1.75h5l3 3v8.75a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1V2.75a1 1 0 0 1 1-1z"/><path d="M9.5 1.75v3h3M6 8.5h4M6 11h4"/></svg>Spec</span></a>
          <a href="/skills"><span class="menu-label"><svg class="icon icon-bolt" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 1.5L3.5 9H8l-1 5.5L12.5 7H8z"/></svg>Skills</span></a>
          <a href="/emergency" title="A plain page for when this one is broken"><span class="menu-label"><svg class="icon icon-lifebuoy" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.5"/><path d="M3.8 3.8l2.4 2.4M9.8 9.8l2.4 2.4M12.2 3.8L9.8 6.2M6.2 9.8l-2.4 2.4"/></svg>Emergency session</span></a>
          <form method="post" action="/auth/sign-out"><button type="submit"><span class="menu-label"><svg class="icon icon-logout" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 2.5H4A1.5 1.5 0 0 0 2.5 4v8A1.5 1.5 0 0 0 4 13.5h2.5M10 5l3 3-3 3M13 8H6.5"/></svg>Sign out</span></button></form>
        </div>
      </details>
    </div>
  </header>
  <div id="banner" class="banner-area"></div>
  <main class="spend-layout">
    <div class="spend-head">
      <h1>Usage</h1>
      <div class="spend-controls">
        <div class="seg spend-periods" role="group" aria-label="Period">
          <button type="button" data-period="week" title="Since the earlier of the accounts' current weeks began">This week</button>
          <button type="button" data-period="1">24 hours</button>
          <button type="button" data-period="7">7 days</button>
          <button type="button" data-period="30">30 days</button>
        </div>
        <div class="seg spend-measures" role="group" aria-label="Measure">
          <button type="button" data-measure="week" title="The share of one account's weekly limit">% of a week</button>
          <button type="button" data-measure="api">API price</button>
          <button type="button" data-measure="plan" title="The share of a week at the plan's price: 400 % is $200">Plan price</button>
        </div>
      </div>
    </div>
    <section id="spend-limits" aria-labelledby="limits-title"><div class="ghost-box ghost-usage" data-ghost role="status" aria-label="Loading the usage limits"><span class="ghost-bar tall w-30"></span><span class="ghost-gap"></span><span class="ghost-bar w-90"></span><span class="ghost-bar w-80"></span><span class="ghost-bar w-90"></span><p class="note ghost-note"></p></div></section>
    <section id="spend-daily" aria-labelledby="daily-title"><div class="ghost-box ghost-usage" data-ghost role="status" aria-label="Loading the daily usage"><span class="ghost-bar tall w-20"></span><span class="ghost-gap"></span><span class="ghost-bar ghost-chart"></span><p class="note ghost-note"></p></div></section>
    <p id="spend-lede" class="spend-lede"></p>
    <section id="spend-totals" class="spend-totals" aria-label="Totals"></section>
    <section id="spend-where" aria-labelledby="where-title"></section>
    <section id="spend-misses" aria-labelledby="misses-title"></section>
    <details id="spend-more" class="spend-more">
      <summary>All the tables</summary>
      <section id="spend-models" aria-labelledby="models-title"></section>
      <section id="spend-sessions" aria-labelledby="sessions-title"></section>
      <section id="spend-skills" aria-labelledby="skills-title"></section>
      <section id="spend-origins" aria-labelledby="origins-title"></section>
      <section id="spend-session-kinds" aria-labelledby="session-kinds-title"></section>
      <section id="spend-top" aria-labelledby="top-title"></section>
      <section id="spend-codex" aria-labelledby="codex-title"></section>
    </details>
    <details class="spend-more spend-method-fold">
      <summary>How it is counted</summary>
      <p id="spend-method" class="spend-method"></p>
    </details>
  </main>
</body>
</html>
