# Builds the public demo page and deploys it to Cloudflare Pages on every push to main, then checks that
# https://try-cockpit.pages.dev/ serves the page this run built. demo/README.md says which secrets it needs.
name: Demo

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    # A fork has no use for the deploy and no access to the secrets.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One deploy at a time; a push during a deploy waits for it.
    concurrency:
      group: demo-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install Cockpit
        run: |
          python -m pip install uv==0.13.7
          uv sync --locked --extra test

      - name: Build the demo page
        run: .venv/bin/python demo/build.py

      - name: Make the site
        run: |
          mkdir site
          cp demo/dist/cockpit-demo.html site/index.html
          cp demo/_headers site/_headers

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          # npx installs wrangler's dependencies fresh: refuse any version published in the last 3 days.
          npm_config_min_release_age: "3"
        run: npx --yes wrangler@4.141.0 pages deploy site --project-name try-cockpit --branch main --commit-dirty=true

      - name: Check the live page
        run: |
          want="$(sha256sum < site/index.html)"
          deadline=$((SECONDS + 120))
          until [ "$(curl -fsS --max-time 20 https://try-cockpit.pages.dev/ | sha256sum)" = "$want" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "try-cockpit.pages.dev does not serve this build two minutes after the deploy." >&2
              exit 1
            fi
            sleep 10
          done
          echo "try-cockpit.pages.dev serves this build."
