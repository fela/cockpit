[project]
name = "cockpit"
version = "0.1.0"
description = "Cockpit, the user's view of all their work: what needs the user next, across sessions, PRs, Slack and Linear."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "markdown-it-py[linkify]>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cockpit = "cockpit.cli:main"
cockpit-server = "cockpit.server:main"
cockpit-attribution-hook = "cockpit.attribution:main"
cockpit-standing-rules = "cockpit.standing_rules:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cockpit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["ISC004"]  # Long UI text and test commands intentionally use implicit string concatenation in collections.

# `uvx ty@0.0.89 check` from the repo root (README, Development). The findings ty reported when it was added are baselined as
# `# ty: ignore[...]` comments (mostly values that are Optional by type but set in practice);
# new code should pass without adding more.
[tool.ty.environment]
python = ".venv"

[tool.ty.src]
include = ["src"]
